name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the secrets scan reads the whole history
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Secrets scan (files and history)
        run: python tools/scan_secrets.py --history

  # Every screen of the terminal app in every language: SVG screenshots to look at, and a check that each
  # opens, shows no error and has no English text left untranslated.
  tui-screens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python tools/tui_shots.py --out tui-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tui-screens
          path: tui-shots/
          retention-days: 14

  # The exact Ubuntu steps from the README, on clean Ubuntu images with the system Python.
  ubuntu-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pipx and git with apt (README step 1)
        run: |
          sudo apt-get update
          sudo apt-get install -y pipx git desktop-file-utils
          pipx ensurepath
      - name: Install Lanterna with pipx (README step 2, from this commit)
        run: pipx install .
      - name: The command works
        run: |
          lanterna --version
          lanterna about
          lanterna local
      - name: App menu launcher (README step 3)
        run: |
          lanterna desktop
          desktop-file-validate ~/.local/share/applications/lanterna.desktop
          test -f ~/.local/share/icons/hicolor/scalable/apps/lanterna.svg
          cat ~/.local/share/applications/lanterna.desktop
          lanterna desktop --remove
          test ! -f ~/.local/share/applications/lanterna.desktop
      - name: Full-screen app starts in a terminal
        run: |
          # run the TUI for a few seconds inside a pseudo-terminal; it must not crash on start
          timeout 6 script -qec "lanterna" /dev/null > tui.log 2>&1 || code=$?
          test "${code:-0}" = "124"           # 124 = still running when the timeout stopped it
      - name: The update command from the update notice works (pipx upgrade of a git install)
        run: |
          # a copy of this repo as an "older" release, installed from git like the README does
          git clone --quiet . "$RUNNER_TEMP/repo"
          cd "$RUNNER_TEMP/repo"
          sed -i 's/^__version__ = .*/__version__ = "0.0.1"/' src/lanterna/__init__.py
          git -c user.name=ci -c user.email=ci@example.com commit -qam "old"
          pipx install --force "git+file://$RUNNER_TEMP/repo"
          lanterna --version | grep -F "0.0.1"
          # a newer version is pushed; the notice's command must pick it up
          sed -i 's/^__version__ = .*/__version__ = "0.0.2"/' src/lanterna/__init__.py
          git -c user.name=ci -c user.email=ci@example.com commit -qam "new"
          pipx upgrade lanterna
          lanterna --version | grep -F "0.0.2"
