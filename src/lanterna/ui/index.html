<title>Lanterna</title>
<link rel="icon" href="logo.svg">
<script>/* the theme before the first paint (app.js keeps it in step with Settings) */
try { var th = localStorage.getItem("theme"); if (th === "system") th = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";

<link rel="stylesheet" href="style.css">
