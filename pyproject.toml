[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lanterna"
dynamic = ["version"]
description = "A friendly AI assistant that runs on free cloud models or your own local models."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "mikybuilds" }]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "keyring>=24",
    "platformdirs>=4",
    "rich>=13",
    "textual>=3",
    "pillow>=10",
    "pypdf>=4",
    "cryptography>=42",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Chat",
]

[project.optional-dependencies]
gui = ["pywebview>=5"]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/mikybuilds/lanterna"

[project.scripts]
lanterna = "lanterna.cli:main"

[project.gui-scripts]
lanterna-gui = "lanterna.gui:main"

[tool.setuptools.dynamic]
version = { attr = "lanterna.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lanterna = ["ui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
